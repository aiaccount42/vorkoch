<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vorkoch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Vorkoch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<meta name="theme-color" content="#F2F2F7">
<style>
/* Vorkoch: ruhig, hell, große Titel, gruppierte Listen, weiche Karten. Eine Akzentfarbe, Gericht-Farben nur als kleine Punkte. */
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --card2: #F7F7FA;
  --ink: #1C1C1E; --ink2: #636366; --ink3: #A1A1A6;
  --line: rgba(60, 60, 67, .16); --fill: rgba(120, 120, 128, .12);
  --accent: #F2B01E; --accentink: #2A1C00; --accentfg: #8F5A00; --tint: rgba(242, 176, 30, .20);
  --warn: #B25400; --warnbg: rgba(255, 149, 0, .14); --danger: #D70015;
  --bar: rgba(249, 249, 252, .82); --scrim: rgba(0, 0, 0, .38);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 20px rgba(0, 0, 0, .05);
  --c1: #22A06B; --c2: #E8643A; --c3: #3B82F6; --c4: #9B6BEA; --c5: #D4476B;
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Roboto', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1C1C1E; --card2: #2C2C2E;
    --ink: #F5F5F7; --ink2: #AEAEB2; --ink3: #636366;
    --line: rgba(235, 235, 245, .16); --fill: rgba(120, 120, 128, .28);
    --accent: #F5B93A; --accentink: #241700; --accentfg: #F5B93A; --tint: rgba(245, 185, 58, .18);
    --warn: #FFB340; --warnbg: rgba(255, 159, 10, .18); --danger: #FF6961;
    --bar: rgba(28, 28, 30, .78); --scrim: rgba(0, 0, 0, .6);
    --shadow: none;
    --c1: #4ADE9B; --c2: #FF8F66; --c3: #6FA3FF; --c4: #B896FF; --c5: #FF7A9C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --card2: #2C2C2E;
  --ink: #F5F5F7; --ink2: #AEAEB2; --ink3: #636366;
  --line: rgba(235, 235, 245, .16); --fill: rgba(120, 120, 128, .28);
  --accent: #F5B93A; --accentink: #241700; --accentfg: #F5B93A; --tint: rgba(245, 185, 58, .18);
  --warn: #FFB340; --warnbg: rgba(255, 159, 10, .18); --danger: #FF6961;
  --bar: rgba(28, 28, 30, .78); --scrim: rgba(0, 0, 0, .6);
  --shadow: none;
  --c1: #4ADE9B; --c2: #FF8F66; --c3: #6FA3FF; --c4: #B896FF; --c5: #FF7A9C;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--font); letter-spacing: -.005em;
  font-variant-numeric: tabular-nums;
  padding-block: 8px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.lock { overflow: hidden; }
#app { max-width: 640px; margin: 0 auto; min-width: 0; }
:focus-visible { outline: 3px solid var(--accentfg); outline-offset: 2px; border-radius: 8px; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { -webkit-appearance: none; appearance: none; }
b { font-weight: 600; }
h2, h3, h4, p { margin: 0; }

/* Titel */
.ltitle { font: 800 34px/1.08 var(--font); letter-spacing: -.03em; margin: 18px 2px 2px; text-wrap: balance; }
.lsub { color: var(--ink2); font-size: 15px; margin: 0 2px 14px; }
.sec { font: 700 22px/1.2 var(--font); letter-spacing: -.02em; margin: 30px 2px 10px; }
.cap { font: 600 13px/1.2 var(--font); color: var(--ink2); letter-spacing: .01em; margin: 22px 16px 7px; text-transform: none; }
.foot { font-size: 13px; color: var(--ink2); margin: 8px 16px 0; line-height: 1.4; }
.sub { font-size: 14px; color: var(--ink2); }
.warn { color: var(--warn); font-style: normal; font-weight: 600; }
.alert { background: var(--warnbg); color: var(--ink); border-radius: 14px; padding: 12px 14px; margin: 8px 0; font-size: 15px; }
.ok { color: var(--accentfg); font-weight: 600; font-size: 14px; }

/* Gruppierte Liste */
.grp { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.grp > * + * { border-top: .5px solid var(--line); }
.pad { padding: 14px 16px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 52px; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .val { color: var(--ink2); font-size: 15px; white-space: nowrap; }
button.row { width: 100%; background: none; border: 0; text-align: left; cursor: pointer; }
button.row:active { background: var(--fill); }
.chev::after { content: ""; flex: none; width: 8px; height: 8px; margin-left: 4px; border: solid var(--ink3); border-width: 2px 2px 0 0; transform: rotate(45deg); }

/* Kennzahlen */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.stat small { display: block; font-size: 13px; color: var(--ink2); }
.stat b { display: block; font: 700 24px/1.2 var(--font); letter-spacing: -.02em; margin-top: 2px; }
@media (min-width: 560px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* Buttons */
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.btn {
  flex: 1 1 auto; min-height: 50px; padding: 12px 20px; border-radius: 14px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accentink); font: 600 16px/1.2 var(--font); text-align: center;
  transition: transform .12s ease, opacity .12s ease;
}
.btn:active { transform: scale(.97); opacity: .9; }
.btn.soft { background: var(--tint); color: var(--accentfg); }
.btn.gray { background: var(--fill); color: var(--ink); }
.btn.danger { background: var(--fill); color: var(--danger); }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: 15px; flex: 0 0 auto; border-radius: 12px; }
.lnk { background: none; border: 0; padding: 8px 0; color: var(--accentfg); font-weight: 600; cursor: pointer; min-height: 44px; }

/* Segmentiert und Chips */
.seg { display: flex; gap: 2px; background: var(--fill); border-radius: 12px; padding: 2px; }
.seg button { flex: 1; min-width: 0; min-height: 36px; border: 0; border-radius: 10px; background: none; font-size: 14px; font-weight: 500; color: var(--ink); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed=true] { background: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; line-height: 1; padding: 6px 10px; border-radius: 999px; background: var(--fill); color: var(--ink2); white-space: nowrap; }
.chip.neu { background: var(--accent); color: var(--accentink); font-weight: 600; padding: 3px 8px; font-size: 11px; margin-left: 6px; vertical-align: 2px; }
.chip.spec { background: var(--warnbg); color: var(--warn); }
.chip.hit { background: var(--tint); color: var(--accentfg); font-weight: 600; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 6px; margin: 0 -16px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; border: 0; border-radius: 999px; padding: 8px 14px; min-height: 36px; background: var(--card); color: var(--ink); font-size: 14px; cursor: pointer; box-shadow: var(--shadow); }
.filters button[aria-pressed=true] { background: var(--accent); color: var(--accentink); font-weight: 600; }

/* Eingaben */
input[type=text], input[type=number], input[type=search], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 14px; border: 0; border-radius: 12px; background: var(--fill); color: var(--ink); font-size: 16px;
}
input::placeholder { color: var(--ink3); }
.inl { text-align: right; background: none !important; padding: 8px 0; min-height: 40px; width: 120px; flex: none; }
select.inl { width: auto; max-width: 55%; text-align-last: right; }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 36px; }
.flex { display: flex; gap: 8px; }

/* Schalter */
.sw { position: relative; flex: none; width: 51px; height: 31px; }
.sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--ink3); transition: background .2s; }
.sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .25); transition: transform .2s; }
.sw input:checked + i { background: var(--accent); }
.sw input:checked + i::after { transform: translateX(20px); }
.sw input:focus-visible + i { outline: 3px solid var(--accentfg); outline-offset: 2px; }

/* Punkt */
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--ink3)); flex: none; }
.dot.off { background: transparent; border: 1.5px solid var(--ink3); }

/* Woche */
.day { display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding: 10px 12px 10px 10px; align-items: stretch; }
.dn { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.dn b { font-size: 13px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: .04em; }
.dn span { font-size: 22px; font-weight: 700; letter-spacing: -.02em; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; margin-top: 2px; }
.dn small { display: none; }
.day.today .dn span { background: var(--accent); color: var(--accentink); }
.slot { min-width: 0; min-height: 62px; padding: 8px 10px; border-radius: 12px; background: var(--card2); border: 0; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
button.slot { cursor: pointer; }
button.slot:active { background: var(--fill); }
.slot .m { font-size: 11.5px; color: var(--ink2); display: flex; align-items: center; gap: 5px; }
.slot b { font-size: 14.5px; line-height: 1.2; font-weight: 600; overflow-wrap: anywhere; }
.slot.off { background: none; border: 1px dashed var(--line); color: var(--ink3); font-size: 12.5px; }
.dh { display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding: 10px 12px 4px 10px; font-size: 12px; font-weight: 600; color: var(--ink2); }
.dh span + span { padding-left: 10px; }

/* Kochtermin-Karten */
.sess { padding: 16px; }
.sess h3 { font: 700 18px/1.2 var(--font); letter-spacing: -.01em; }
.sess .who { color: var(--ink2); font-size: 14px; margin-top: 2px; }
.dish { display: flex; gap: 12px; padding: 12px 0 0; margin-top: 12px; border-top: .5px solid var(--line); }
.dish > div { min-width: 0; }
.dish .dot { margin-top: 7px; }
.dish b { font-size: 16px; }
.dish .sub { margin-top: 2px; }
.cfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; }
.cfoot span { font-size: 14px; color: var(--ink2); }

/* Einkauf */
.pbar { height: 6px; border-radius: 999px; background: var(--fill); overflow: hidden; margin: 6px 2px 4px; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s ease; }
.item { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; cursor: pointer; min-height: 56px; }
.item input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box { width: 26px; height: 26px; border: 1.8px solid var(--ink3); border-radius: 50%; display: block; position: relative; background: transparent; transition: background .15s, border-color .15s; }
.item input:focus-visible + .box { outline: 3px solid var(--accentfg); outline-offset: 2px; }
.item input:checked + .box { background: var(--accent); border-color: var(--accent); }
.item input:checked + .box::after { content: ""; position: absolute; left: 8px; top: 3px; width: 6px; height: 12px; border: solid var(--accentink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.itx { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.itx b { font-weight: 500; font-size: 16.5px; }
.itx small { font-size: 13px; color: var(--ink2); line-height: 1.3; }
.itx .rest { color: var(--warn); }
.ipk { font-size: 14px; color: var(--ink2); text-align: right; max-width: 44vw; overflow-wrap: anywhere; }
.item.done .itx b, .item.done .ipk { color: var(--ink3); text-decoration: line-through; }
.item.small { min-height: 48px; padding: 8px 16px; }

/* Kochen */
.thaw { background: var(--warnbg); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; margin-top: 12px; }
.gantt { display: grid; grid-template-columns: 62px minmax(0, 1fr); row-gap: 5px; align-items: center; margin-top: 14px; }
.gh { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13.5px; font-weight: 600; }
.gl { font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; }
.gt { position: relative; height: 22px; border-radius: 6px; background: var(--card2); }
.bar { position: absolute; top: 3px; height: 16px; border-radius: 5px; }
.bar.a { background: var(--c); }
.bar.p { background: color-mix(in srgb, var(--c) 28%, transparent); border: 1.5px solid var(--c); }
.gax { position: relative; height: 16px; }
.gax span { position: absolute; top: 2px; transform: translateX(-50%); font-size: 11px; color: var(--ink2); }
.gax span:first-child { transform: none; }
.legend { font-size: 12.5px; color: var(--ink2); margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lg { display: inline-block; width: 22px; height: 10px; border-radius: 4px; }
.lg.a { background: var(--ink2); }
.lg.p { border: 1.5px solid var(--ink2); background: transparent; margin-left: 10px; }

/* Rezept-Liste und Details */
.rrow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 64px; }
.rrow .open { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 0; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.rrow .open b { font-size: 16px; font-weight: 600; line-height: 1.25; }
.rrow .open small { font-size: 13px; color: var(--ink2); }
.rrow.offrec .open { opacity: .5; }
.search { position: relative; }
.rb h4 { font: 600 13px/1.2 var(--font); color: var(--ink2); margin: 22px 0 8px; }
.rb h5 { font: 600 15px var(--font); margin: 12px 0 4px; }
.ing { list-style: none; margin: 0; padding: 0; background: var(--card2); border-radius: 14px; }
.ing li { padding: 10px 14px; font-size: 15px; }
.ing li + li { border-top: .5px solid var(--line); }
.ing li.v { color: var(--ink2); }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { padding: 10px 0; border-top: .5px solid var(--line); font-size: 15px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; line-height: 1; padding: 4px 8px; border-radius: 999px; white-space: nowrap; margin-right: 6px; vertical-align: 1px; }
.tag.a { background: var(--ink); color: var(--bg); }
.tag.p { background: var(--fill); color: var(--ink2); }
.note { margin-top: 16px; padding: 12px 14px; background: var(--tint); border-radius: 14px; font-size: 14.5px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; animation: fade .2s ease both; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; margin: 0 auto; max-width: 640px; max-height: 92vh; max-height: 92dvh;
  background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .28s cubic-bezier(.2, .9, .3, 1) both;
  box-shadow: 0 -8px 40px rgba(0, 0, 0, .25);
}
.sheet.full { height: 100vh; height: 100dvh; max-height: none; border-radius: 0; }
.shd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 8px; }
.shd .grab { position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--ink3); opacity: .5; }
.sheet.full .grab { display: none; }
.shd h3 { font: 700 20px/1.2 var(--font); letter-spacing: -.02em; flex: 1; min-width: 0; padding-top: 6px; }
.shb { overflow-y: auto; overscroll-behavior: contain; padding: 4px max(16px, env(safe-area-inset-left, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Kochmodus */
.cm-top { display: flex; align-items: center; gap: 4px; padding: 0 2px; }
.cm-top i { flex: 1; height: 4px; border-radius: 2px; background: var(--fill); }
.cm-top i.on { background: var(--accent); }
.cm-body { flex: 1; overflow-y: auto; padding: 18px max(20px, env(safe-area-inset-left, 0px)) 12px; display: flex; flex-direction: column; gap: 14px; }
.cm-clock { font-size: 15px; color: var(--ink2); }
.cm-dish { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.cm-text { font: 600 26px/1.28 var(--font); letter-spacing: -.02em; text-wrap: pretty; }
.cm-kind { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 600; }
.cm-kind.a { background: var(--ink); color: var(--bg); }
.cm-kind.p { background: var(--fill); color: var(--ink); }
.cm-par { background: var(--card); border-radius: 16px; padding: 12px 16px; }
.cm-par p { font-size: 14px; color: var(--ink2); }
.cm-par li { font-size: 15px; margin-top: 4px; list-style: none; display: flex; gap: 8px; align-items: center; }
.cm-par ul { margin: 6px 0 0; padding: 0; }
.cm-foot { display: flex; gap: 10px; padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)); }
.timer { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card); border-radius: 16px; padding: 12px 16px; }
.timer b { font: 700 30px/1 var(--font); letter-spacing: -.02em; }
.timer.done b { color: var(--accentfg); }

/* Tabs */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px); border-top: .5px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
#tabs .in { display: flex; max-width: 640px; margin: 0 auto; }
#tabs button { flex: 1; min-width: 0; min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; color: var(--ink2); cursor: pointer; font: 500 11px/1 var(--font); letter-spacing: .01em; }
#tabs button[aria-current=page] { color: var(--accentfg); }
#tabs button:active svg { transform: scale(.9); }
#tabs svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: transform .12s; }
#tabs button[aria-current=page] svg { stroke-width: 2.1; }

.view { animation: fade .25s ease both; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.cm-body .btn { flex: 0 0 auto; align-self: stretch; }
.sess { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); margin: 12px 0; }
.gax span:last-child:not(:first-child) { transform: translateX(-100%); }

/* Bewertung, Laden, Abgleich */
.rate { display: inline-flex; gap: 4px; flex: 0 0 auto; align-self: flex-start; }
.rate button { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--fill); color: var(--ink2); display: grid; place-items: center; cursor: pointer; }
.rate button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rate button[aria-pressed=true] { background: var(--accent); color: var(--accentink); }
.rate button[aria-pressed=true] svg { fill: currentColor; }
.rate button:focus-visible { outline: 3px solid var(--accentfg); outline-offset: 2px; }
.item .mv { grid-column: 2 / 4; justify-self: start; border: 0; background: var(--fill); color: var(--accentfg); border-radius: 999px; min-height: 32px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.mini { margin: 0; padding-left: 20px; font-size: 14px; color: var(--ink2); line-height: 1.45; }

RECIPES.forEach(r => { BY_ID[r.id] = r; r.servings = 4; r.country = COUNTRY[r.cuisine] || r.cuisine; });
function countries(list) {
  const c = {};
  (list || RECIPES).forEach(r => { c[r.country] = (c[r.country] || 0) + 1; });
  return Object.keys(c).sort((a, b) => c[b] - c[a] || a.localeCompare(b, 'de')).map(k => ({ name: k, n: c[k] }));

/* =========================================================
   HILFSFUNKTIONEN
   ========================================================= */
const FR = { 0.25: '¼', 0.5: '½', 0.75: '¾' };
function fmtQ(x) {
  const w = Math.floor(x + 1e-9), f = Math.round((x - w) * 4) / 4;
  if (f >= 1) return String(w + 1);
  if (f === 0) return String(w);
  return (w ? w : '') + FR[f];
}
function fmtSize(n, unit) {
  if (unit === 'g') return n >= 1000 ? (n / 1000).toString().replace('.', ',') + ' kg' : Math.round(n) + ' g';
  if (unit === 'ml') return n >= 1000 ? (n / 1000).toString().replace('.', ',') + ' l' : Math.round(n) + ' ml';
  return String(n);
}
/* Ganze Zahlen bleiben, Bruchteile (durch Mengenfaktor) werden als ½, ¾ … geschrieben. */
function qty(a) { return Number.isInteger(a) ? a : fmtQ(a); }
function fmtAmt(id, a) {
  const g = ING[id];
  if (g.fm) return g.fm(qty(a));
  if (g.unit === 'g' || g.unit === 'ml') return fmtSize(a, g.unit) + ' ' + g.n + (g.ps ? ' (' + g.ps + ')' : '');
  return qty(a) + ' ' + g.unit + ' ' + g.n;
}
function fmtDur(m) {
  m = Math.round(m);
  if (m < 60) return m + ' Min';
  const h = Math.floor(m / 60), r = m % 60;
  return h + ' h' + (r ? ' ' + r + ' Min' : '');
}
function fmtClock(m) { m = Math.round(m); return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); }

function nutri(r) {
  let p = 0, k = 0, f = 0;
  r.i.forEach(([id, a]) => {
    const g = ING[id];
    const fac = (g.unit === 'g' || g.unit === 'ml') ? a / 100 : a;
    p += (g.p || 0) * fac; k += (g.k || 0) * fac; f += (g.f || 0) * fac;
  });
  return { p: p / r.servings, k: k / r.servings, f: f / r.servings };
}
RECIPES.forEach(r => { r.nu = nutri(r); r.spec = r.i.filter(([id]) => ING[id].spec).map(([id]) => id); });

function activeMin(r) { let s = 0; r.tracks.forEach(t => t.ph.forEach(p => { if (p.k === 'a') s += p.m; })); return s; }
function devices(r) { const s = new Set(); r.tracks.forEach(t => t.ph.forEach(p => { if (p.d) s.add(p.d); })); return [...s]; }

/* =========================================================
   EINKAUF
   ========================================================= */
function need(recipes, facs) {
  const t = {};
  recipes.forEach((r, k) => r.i.forEach(([id, a]) => { t[id] = (t[id] || 0) + a * (facs ? facs[k] : 1); }));
  return t;
}
function shop(recipes, facs) {
  const t = need(recipes, facs);
  const items = [], vorrat = [];
  Object.keys(t).forEach(id => {
    const g = ING[id];
    if (g.cls === 'pantry') { vorrat.push({ id, n: g.n, spec: !!g.spec }); return; }
    const packs = Math.max(1, Math.ceil(t[id] / g.pack - 1e-9));
    const left = packs * g.pack - t[id];
    const forR = [...new Set(recipes.filter(r => r.i.some(x => x[0] === id)).map(r => r.short))];
    const counts = g.unit === 'g' || g.unit === 'ml';
    let txt = packs + ' ' + (packs === 1 ? g.pl : g.pls);
    if (counts) txt += ' · je ' + fmtSize(g.pack, g.unit) + (g.ps ? ' ' + g.ps : '');
    else if (g.pack > 1) txt += ' · je ' + g.pack + ' ' + (g.nm || g.unit);
    const rest = (g.cls === 'fresh' || g.cls === 'can') && left > g.pack * 0.04;
    items.push({
      id, n: g.n, spec: !!g.spec, a: g.a, cls: g.cls, need: t[id], packs, left, leftFrac: left / g.pack, forR, txt,
      needTxt: counts ? fmtSize(t[id], g.unit) : (g.fm ? g.fm(qty(t[id])) : fmtQ(t[id]) + ' ' + g.unit),
      leftTxt: rest ? (counts ? fmtSize(left, g.unit) : fmtQ(left) + ' ' + (g.nm || g.unit)) : '', rest
    });
  });
  items.sort((x, y) => AISLES.indexOf(x.a) - AISLES.indexOf(y.a) || x.n.localeCompare(y.n, 'de'));
  vorrat.sort((x, y) => x.n.localeCompare(y.n, 'de'));
  return { items, vorrat };
}
function wasteScore(recipes) {
  const t = need(recipes);
  let w = 0, kinds = 0;
  Object.keys(t).forEach(id => {
    const g = ING[id];
    if (g.cls === 'pantry') return;
    kinds++;
    const packs = Math.max(1, Math.ceil(t[id] / g.pack - 1e-9));
    const frac = (packs * g.pack - t[id]) / g.pack;
    if (g.cls === 'fresh') w += frac;
    else if (g.cls === 'can') w += 0.8 * frac;
  });
  return w + 0.06 * kinds;
}

/* =========================================================

   ========================================================= */
function scheduleSession(list) {

  const n = chains.length;

  const log = [];

      else m = Math.max(m, ready[i]);
    }
    return m;
  }
  function depReady(i) {
    const w = chains[i].ph[idx[i]].w;
    if (!w) return 0;
    let m = 0;
    for (let j = 0; j < n; j++) {
      if (j === i || chains[j].r !== chains[i].r || !w.includes(chains[j].n)) continue;

    }
    if (!cand.length) return;
    cand.sort((a, b) => (rem[b][idx[b]] - chains[b].ph[idx[b]].m) - (rem[a][idx[a]] - chains[a].ph[idx[a]].m));

/* ---------- Plan ---------- */
function cellWarn(k) {
  const x = S.grid[k];
  if (x.t === 'p' && !x.r) return B.sessions.some(s => !s.fresh && V.sessTime(s) <= V.cellTime(k)) ? 'Kein Gericht fertig' : 'Kein Kochtermin davor';
  if (x.t === 'f' && !x.r) return 'Kein Rezept';
  if (x.t === 'p' && x.r && B.time[x.r] !== undefined && B.time[x.r] > V.cellTime(k)) return 'Noch nicht gekocht';
  return '';
}
function cellSess(k) { const x = S.grid[k]; return x && x.t === 'p' && x.r ? B.sessions.find(s => !s.fresh && s.rs.some(r => r.id === x.r)) : null; }
function cellWho(k) {
  const x = S.grid[k];
  if (x.t === 'f') return B.sessions.find(s => s.fresh && s.cell === k) ? whoCode(B.sessions.find(s => s.fresh && s.cell === k)) : 'b';
  const s = cellSess(k); return s ? whoCode(s) : 'b';
}
const whoTag = c => c === '0' || c === '1' ? ' · ' + esc((names()[+c] || '?').charAt(0).toUpperCase()) : '';
function slotHtml(k) {
  const x = S.grid[k], w = cellWarn(k);
  const wh = w ? '<span class="cw">' + w + '</span>' : '';
  if ((x.t === 'p' || x.t === 'f') && x.r && V.BY_ID[x.r]) {
    const r = V.BY_ID[x.r];
    let m;
    if (x.t === 'f') m = dot(-1) + 'frisch gekocht' + whoTag(cellWho(k));
    else { const age = Math.max(0, +k[0] - Math.floor((B.time[x.r] || 0) / 1440)); m = dot(dishIdx(x.r)) + (age < 3 ? AGE[age] : age + ' Tage alt') + whoTag(cellWho(k)); }
    return '<button class="slot" data-act="cell" data-k="' + k + '"><span class="m">' + m + '</span><b>' + esc(r.short) + '</b>' + wh + '</button>';
  }
  if (x.t === 'p' || x.t === 'f') return '<button class="slot warnslot" data-act="cell" data-k="' + k + '"><span class="m">' + TYPE_NAME[x.t] + '</span><b>–</b>' + wh + '</button>';
  return '<button class="slot off" data-act="cell" data-k="' + k + '">' + (x.t === 'o' ? 'Auswärts' : 'Offen') + '</button>';
}

const dayOpts = (cur, withBefore) => (withBefore ? [[-1, 'Sa davor']] : []).concat([1, 2, 3, 4, 5, 6, 0].map(d => [d, DAYS[d]])).map(([d, l]) => '<option value="' + d + '"' + (cur === d ? ' selected' : '') + '>' + l + '</option>').join('');
const tl = t => t || 'tagsüber';
const dayLbl = d => d < 0 ? 'Sa davor' : DAYS[d];
const whoLabel = c => c === '0' || c === '1' ? (names()[+c] || '?') : 'zusammen';
function termsCard() {
  const sl = sessList();
  const chip = (cls, k, title, line) => '<button class="tchip ' + cls + '" data-act="term" data-term="' + k + '"><b>' + esc(title) + '</b><span>' + esc(line) + '</span></button>';
  let h = '<p class="cap" style="margin-left:2px">Termine</p><div class="terms">';
  h += chip('shop', 'shop', 'Einkauf ' + dayLbl(S.shopAt.day), tl(S.shopAt.time) + ' · ' + whoLabel(shopCode()));
  sl.forEach((s, i) => {
    const bs = B.sessions.find(x => x.key === 's' + i), c = bs ? whoCode(bs) : (s.w || 'b');
    h += chip('', i, 'Kochen ' + DAYS[s.day], tl(s.time) + ' · ' + whoLabel(c));
  });
  if (sl.length < 4) h += '<button class="tchip add" data-act="sessadd">+ Kochtermin</button>';
  h += '</div><p class="foot" style="margin:8px 2px 14px">Tippe auf einen Termin, um Tag, Uhrzeit und Person zu ändern. Frisch gekocht wird mittags um 11:30 und abends um 18:00.</p>';

}

    (S.cal ? '<button class="row" data-act="calpub"><span class="grow"><b>Kalender aktualisieren</b></span><span class="val">' + (ghTok() ? 'automatisch · ' : 'Token fehlt · ') + calAgo() + '</span></button>' : '') +
    '<label class="row"><span class="grow"><b>Küche der Woche</b><div class="sub">bevorzugt beim Vorschlag</div></span><select class="inl day" data-motto aria-label="Küche der Woche" style="width:auto;max-width:150px"><option value="">Egal</option>' + V.countries().filter(c => c.n >= 2).map(c => '<option value="' + esc(c.name) + '"' + (S.motto === c.name ? ' selected' : '') + '>' + esc(c.name) + ' (' + c.n + ')</option>').join('') + '</select></label>' +

      const list = items.filter(x => x.a === a);

    });
  }
  h += '<p class="cap">Zuhause prüfen</p><div class="grp">';
  B.shop.vorrat.forEach(x => {

    h += '<label class="item small' + (map[tk(k)] ? ' done' : '') + '"><input type="checkbox" data-key="' + k + '" data-v="1"' + (map[tk(k)] ? ' checked' : '') + '><span class="box"></span><span class="itx"><b>' + esc(x.n) + (x.spec ? '<span class="chip spec" style="margin-left:6px">Spezial</span>' : '') + '</b></span><span></span></label>';
  });
  h += '</div><p class="foot">Fehlendes kommt auf die Liste. Tiefkühlware am Vorabend in den Kühlschrank legen. Hackfleisch kommt nur in die ersten beiden Kochtermine, damit es frisch bleibt.</p>';

  return h;
}

/* ---------- Kochen ---------- */
function gantt(s) {
  const mk = s.sched.mk, tk = mk <= 60 ? 10 : mk <= 120 ? 15 : 30;
  let h = '<div class="gantt">';
  s.rs.forEach(r => {
    const i = dishIdx(r.id);
    h += '<div class="gh">' + dot(i) + esc(r.short) + '</div>';
    s.sched.rows.filter(x => x.rid === r.id).forEach(rw => {
      h += '<div class="gl">' + esc(rw.tn) + '</div><div class="gt" style="--c:var(--c' + (i + 1) + ')">';
      s.sched.events.filter(e => e.c === rw.c).forEach(e => {
        h += '<span class="bar ' + e.k + '" style="left:' + (e.start / mk * 100) + '%;width:' + Math.max(1.2, e.m / mk * 100) + '%"></span>';
      });
      h += '</div>';
    });
  });
  h += '<div></div><div class="gax">';
  for (let t = 0; t <= mk + 0.1; t += tk) h += '<span style="left:' + (t / mk * 100) + '%">' + V.fmtClock(t) + '</span>';
  h += '</div></div><p class="legend"><span class="lg a"></span>du bist dran<span class="lg p"></span>läuft von allein</p>';
  return h;
}
function viewCook() {
  const days = weekDays();

  if (!B.sessions.length) h += '<div class="grp pad"><p class="sub">Diese Woche ist nichts zu kochen. Lege auf der Woche-Seite Felder auf „Vorgekocht“ oder „Frisch“.</p></div>';
  B.sessions.forEach(s => {
    const dd = days[s.day];
    h += '<section class="sess"><h3>' + dd.n + ' ' + dd.date + (s.fresh ? ' · ' + MEAL_NAME[s.cell[1]] + ' frisch' : '') + '</h3><p class="who">' + esc(cookWho(s)) + ' · ' + V.fmtDur(s.sched.mk) + ' gesamt, ' + V.fmtDur(s.sched.active) + ' aktiv · ' + esc(s.dev.join(' und ')) + '</p>';
    if (s.thaw.length) h += '<p class="thaw">Am Vorabend in den Kühlschrank legen: ' + esc(s.thaw.join(', ')) + '</p>';

const CARBS = ['Nudeln', 'Reis', 'Kartoffel', 'Brot', 'Sonstige'];
function carbOf(r) {
  const b = r.base;
  return b === 'Nudeln' || b === 'Reis' ? b : b === 'Kartoffel' || b === 'Süßkartoffel' ? 'Kartoffel' : b === 'Brot' || b === 'Wraps' ? 'Brot' : 'Sonstige';
}
function filteredRecipes() {
  const q = (S.q || '').trim().toLowerCase(), f = S.filter;
  return V.RECIPES.filter(r => {
    if (f === 'veg' || f === 'fisch' || f === 'fleisch') { if (r.kind !== f) return false; }
    else if (f === 'new') { if (!r.isNew) return false; }
    else if (f === 'rewe') { if (r.src !== 'REWE Rezeptideen') return false; }
    else if (f === 'off') { if (!S.disabled.includes(r.id)) return false; }
    if (S.country && r.country !== S.country) return false;
    if (S.carb && carbOf(r) !== S.carb) return false;
    if (!q) return true;
    return (r.name + ' ' + r.cuisine + ' ' + r.country + ' ' + r.i.map(x => V.ING[x[0]].n).join(' ')).toLowerCase().includes(q);
  });
}
function recipeList() {
  const list = filteredRecipes();
  if (!list.length) return '<p class="foot" style="text-align:center;margin-top:30px">Nichts gefunden.</p>';

});

function termObj() {
  const sh = S.sheet; if (!sh || sh.t !== 'term') return null;
  if (sh.k === 'shop') return { shop: true, o: S.shopAt };
  const o = S.sess[+sh.k]; return o ? { shop: false, o } : null;
}
function termAfter(t) {
  if (t.shop) { touch('plan'); save(); render(); return; }
  S.sess = V.sortSess(S.sess); S.sheet.k = String(S.sess.indexOf(t.o)); editGrid(() => {}); render();
}

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.tday !== undefined) {
    const o = termObj(), v = +t.value; if (o && v >= (o.shop ? -1 : 0) && v <= 6) { o.o.day = v; termAfter(o); }
  } else if (t.dataset && t.dataset.tmode !== undefined) {
    const o = termObj(); if (o) { o.o.time = t.value === 'time' ? (o.shop ? '10:00' : '18:00') : ''; termAfter(o); }
  } else if (t.dataset && t.dataset.ttime !== undefined) {
    const o = termObj(); if (o && /^\d{1,2}:\d{2}$/.test(t.value)) { o.o.time = t.value; termAfter(o); }
  } else if (t.dataset && t.dataset.twho !== undefined) {
    const o = termObj(); if (o && /^[ab01]$/.test(t.value)) {
      if (o.shop) { if (t.value === 'b' || t.value === 'a') delete o.o.w; else o.o.w = t.value; }
      else if (t.value === 'a') delete o.o.w; else o.o.w = t.value;
      termAfter(o);
    }
  } else if (t.dataset && t.dataset.shopwho !== undefined) {
    if (/^[b01]$/.test(t.value)) { if (t.value === 'b') delete S.shopAt.w; else S.shopAt.w = t.value; touch('plan'); save(); render(); }
  } else if (t.dataset && t.dataset.pwho !== undefined) {
    const o = sessList()[+t.dataset.pwho]; if (o && /^[ab01]$/.test(t.value)) { if (t.value === 'a') delete o.w; else o.w = t.value; touch('plan'); save(); render(); }
  } else if (t.dataset && t.dataset.cwho !== undefined) {
    const k = S.sheet && S.sheet.k; if (k && /^[ab01]$/.test(t.value)) { editGrid(g => { if (t.value === 'a') delete g[k].w; else g[k].w = t.value; }); render(); }
  } else if (t.dataset && t.dataset.motto !== undefined) {
    S.motto = t.value && V.countries().some(c => c.name === t.value) ? t.value : ''; touch('settings'); save(); render();
  } else if (t.id === 'syncurl') { /* wird beim Verbinden gelesen */ }
  else if (t.dataset && t.dataset.pool) {
    const id = t.dataset.pool, k = S.disabled.indexOf(id);
    if (t.checked && k >= 0) S.disabled.splice(k, 1); else if (!t.checked && k < 0) S.disabled.push(id);
    touch('pool');
    const w = t.closest('.rrow'); if (w) w.classList.toggle('offrec', !t.checked);
    const c = document.getElementById('poolcnt'); if (c) c.textContent = pool().length + ' von ' + V.RECIPES.length;
    save();
  } else if (t.matches('input[type=checkbox][data-key]')) {
    S.checked.map[tk(t.dataset.key)] = t.checked; touchKey('checked', tk(t.dataset.key));
    const row = t.closest('.item'); if (row) row.classList.toggle('done', t.checked);
    const items = B.shop.items, n = items.filter(x => S.checked.map[tk(x.id)]).length, pr = document.getElementById('prog'), pb = document.getElementById('pbar');
    if (pr) pr.textContent = n + ' von ' + items.length;
    if (pb) pb.style.width = (items.length ? n / items.length * 100 : 0) + '%';
    save();
  } else if (t.id === 'div') { S.diversity = t.value / 100; touch('settings'); save(); }
  else if (t.id === 'offers') { S.offers = t.value; touch('offers'); save(); }
  else if (t.id === 'share') { S.settings.share = t.value / 100; touch('settings'); save(); render(); }
  else if (t.dataset && t.dataset.set) {
    const k = t.dataset.set;
    if (k === 'name') S.settings.persons[+t.dataset.i].name = t.value.trim() || (t.dataset.i === '0' ? 'Roman' : 'Partnerin');
    else if (k === 'protein') S.settings.persons[+t.dataset.i].protein = Math.min(220, Math.max(40, +t.value || 90));
    else S.settings[k] = +t.value;
    touch('settings'); save(); render();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'share') { const o = document.getElementById('sharev'); if (o) o.textContent = t.value + ' %'; }
  else if (t.id === 'q') { S.q = t.value; const l = document.getElementById('rlist'); if (l) l.innerHTML = recipeList(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
let tx = null;
document.addEventListener('touchstart', e => { if (S.sheet && S.sheet.t === 'cook' && e.touches && e.touches[0]) tx = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
document.addEventListener('touchend', e => {
  if (!tx || !S.sheet || S.sheet.t !== 'cook' || !e.changedTouches || !e.changedTouches[0]) { tx = null; return; }
  const dx = e.changedTouches[0].clientX - tx[0], dy = e.changedTouches[0].clientY - tx[1];
  tx = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 60) return;
  const n = cookEvents().length;
  if (dx < 0) { if (S.ci < n - 1) { S.ci++; render(); } }
  else if (S.ci > 0) { S.ci--; render(); }
}, { passive: true });

applyTheme();
checkHash();
render();
if (syncOn()) { S.sync.fresh = !!S.sync.fresh; syncNow(); }
})();

</script>
